<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart City Control Center</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Loading Screen -->
<div id="loading">Loading...</div>

<!-- Animated Background Particles -->
<canvas id="background"></canvas>

<!-- Header / Hero Section -->
<section class="hero">
  <div class="hero-content">
    <h1>Smart City Control Center</h1>
    <p>AI-powered urban monitoring for the future</p>
    <button class="btn glow">Launch Dashboard</button>
  </div>
</section>

<!-- City Overview Dashboard -->
<section class="dashboard overview">
  <h2>Live City Overview</h2>
  <div class="cards-container">
    <div class="card" id="population">
      <h3>Population</h3>
      <p class="counter" data-target="1250000">0</p>
    </div>
    <div class="card" id="traffic">
      <h3>Traffic Density</h3>
      <p class="counter" data-target="75">0</p>
    </div>
    <div class="card" id="airquality">
      <h3>Air Quality Index</h3>
      <p class="counter" data-target="42">0</p>
    </div>
    <div class="card" id="energy">
      <h3>Energy Consumption</h3>
      <p class="counter" data-target="3200">0</p>
    </div>
    <div class="card" id="internet">
      <h3>Internet Usage</h3>
      <p class="counter" data-target="85">0</p>
    </div>
    <div class="card" id="water">
      <h3>Water Supply</h3>
      <p class="counter" data-target="99">0</p>
    </div>
  </div>
</section>

<!-- More sections like Traffic, Weather, Security, etc., can be added similarly -->

<!-- Footer -->
<footer>
  <p>Smart City Dashboard | Built with HTML, CSS, JS</p>
  <div class="social-icons">
    <a href="#">Twitter</a>
    <a href="#">LinkedIn</a>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
